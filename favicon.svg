<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#grad)"/>
  
  <!-- Globe outline -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="white" stroke-width="1.5"/>
  
  <!-- Vertical line -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="white" stroke-width="1.5"/>
  
  <!-- Horizontal line -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="white" stroke-width="1.5"/>
  
  <!-- Curved lines for globe -->
  <path d="M 22 20 Q 32 18 42 20" fill="none" stroke="white" stroke-width="1.5"/>
  <path d="M 22 44 Q 32 46 42 44" fill="none" stroke="white" stroke-width="1.5"/>
  
  <!-- Digital points/nodes -->
  <circle cx="32" cy="20" r="2" fill="white"/>
  <circle cx="42" cy="32" r="2" fill="white"/>
  <circle cx="32" cy="44" r="2" fill="white"/>
  <circle cx="22" cy="32" r="2" fill="white"/>
</svg>